name: Build Android App Bundle

# Manual only — building an AAB on every push would burn CI minutes and produce
# bundles nobody uploads. Run it from the Actions tab when you want a release.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name shown to users (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Version code — a whole number that must INCREASE on every upload to Play'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Bubblewrap targets JDK 17. The runner ships several JDKs; pin it explicitly
      # so the build does not drift when the runner image changes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fail early if the domain has not been set
        run: |
          if grep -q 'REPLACE_WITH_' twa-manifest.json; then
            echo "::error::twa-manifest.json still has placeholders."
            echo "Run 'npm run set-domain -- <your-domain>' and commit the result first."
            exit 1
          fi

      - name: Check required secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "See PLAY_STORE.md for how to create the keystore and add these secrets."
            exit 1
          }

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      # Point Bubblewrap at the JDK from setup-java and the Android SDK that is
      # preinstalled on the runner, so it does not try to download its own.
      - name: Configure Bubblewrap
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK" ] && [ -d "$SDK" ] || { echo "::error::No Android SDK on this runner"; exit 1; }

          # Bubblewrap expects the OLD SDK layout: AndroidSdkTools.validatePath
          # requires <sdk>/tools or <sdk>/bin to exist, and installBuildTools looks
          # for sdkmanager at <sdk>/tools/bin/sdkmanager or <sdk>/bin/sdkmanager.
          # GitHub runners ship the modern layout (cmdline-tools/<version>/bin) and
          # have neither, so Bubblewrap rejects a perfectly good SDK with
          # "The provided androidSdk isn't correct." Link the real bin directory
          # into the location it expects.
          if [ ! -e "$SDK/bin" ] && [ ! -e "$SDK/tools" ]; then
            CMDLINE_BIN="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -1 || true)"
            [ -n "$CMDLINE_BIN" ] || { echo "::error::No cmdline-tools found under $SDK"; exit 1; }
            ln -s "$CMDLINE_BIN" "$SDK/bin" 2>/dev/null || sudo ln -s "$CMDLINE_BIN" "$SDK/bin"
            echo "Linked $SDK/bin -> $CMDLINE_BIN"
          fi
          [ -x "$SDK/bin/sdkmanager" ] || { echo "::error::sdkmanager not executable at $SDK/bin/sdkmanager"; exit 1; }

          # Accept licences up front so Bubblewrap's own build-tools install (which
          # runs interactively) can't stall waiting for input.
          yes | "$SDK/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          # Pre-install the build-tools Bubblewrap pins, so it skips that step.
          # Best-effort: if the version moves, Bubblewrap installs it itself.
          "$SDK/bin/sdkmanager" --install "build-tools;36.1.0" > /dev/null 2>&1 || true

          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${SDK}"
          }
          EOF
          echo "JAVA_HOME=$JAVA_HOME"
          echo "SDK=$SDK"
          ls "$SDK/build-tools" 2>/dev/null || echo "(no build-tools dir yet)"

      # apksigner reports a wrong alias and an alias with no key identically
      # ("entry ... does not contain a key"), because KeyStore.getKey returns null
      # for both. Resolve the alias against the keystore here so that failure is
      # diagnosed up front rather than 60 seconds later at the signing step.
      - name: Restore and verify signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          # tr -d strips any stray whitespace or newlines introduced when the
          # base64 was pasted into the secret.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android.keystore
          # Never let the key reach an artifact or a commit.
          echo "android.keystore" >> .git/info/exclude

          SIZE=$(stat -c%s android.keystore)
          echo "Restored keystore: $SIZE bytes"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::Keystore is only $SIZE bytes — ANDROID_KEYSTORE_BASE64 looks truncated."
            echo "Re-copy the ENTIRE contents of keystore.b64 into the secret."
            exit 1
          fi

          if ! keytool -list -keystore android.keystore \
                 -storepass "$KEYSTORE_PASSWORD" > /tmp/ks.txt 2>/tmp/ks.err; then
            echo "::error::Could not open the keystore — ANDROID_KEYSTORE_PASSWORD is likely wrong."
            sed -e 's/^/  /' /tmp/ks.err | head -5
            exit 1
          fi

          # keytool prints: "<alias>, <date>, PrivateKeyEntry,"
          ALIASES=$(awk -F', ' '/PrivateKeyEntry/ {print $1}' /tmp/ks.txt)
          COUNT=$(printf '%s\n' "$ALIASES" | grep -c . || true)
          echo "Private key entries found: $COUNT"

          if printf '%s\n' "$ALIASES" | grep -Fxq "$KEY_ALIAS"; then
            RESOLVED="$KEY_ALIAS"
            echo "ANDROID_KEY_ALIAS matches the keystore."
          elif [ "$COUNT" -eq 1 ]; then
            # JKS lowercases aliases, so a capitalisation difference lands here.
            RESOLVED="$ALIASES"
            echo "::warning::ANDROID_KEY_ALIAS does not match the keystore. Using the single private key it contains instead. Update the secret to match."
          else
            echo "::error::ANDROID_KEY_ALIAS is not in the keystore, and it holds $COUNT private keys so one cannot be chosen automatically."
            echo "Set ANDROID_KEY_ALIAS to the alias from KEYSTORE_INFO.txt."
            exit 1
          fi

          echo "RESOLVED_KEY_ALIAS=$RESOLVED" >> "$GITHUB_ENV"

      - name: Set version for this build
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersionName = process.env.VERSION_NAME;
            m.appVersionCode = Number(process.env.VERSION_CODE);
            m.signingKey = { path: "./android.keystore", alias: process.env.RESOLVED_KEY_ALIAS };
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
            console.log(`Building ${m.packageId} ${m.appVersionName} (${m.appVersionCode}) for ${m.host}`);
          '

      # Regenerates the Android project from twa-manifest.json and writes
      # manifest-checksum.txt. Without this, `build` stops to ask a question and
      # the job hangs. --skipVersionUpgrade keeps the versions set above.
      #
      # Note: this step fetches iconUrl over the network, so the site must
      # already be live on your domain before the build will succeed.
      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade

      # TwaManifest.fromFile applies no defaults, so any field this hand-written
      # twa-manifest.json omits renders as an empty substitution — which surfaces
      # as an unreadable 200-line Groovy stack trace from Gradle. Catch it here
      # and name the offending line instead.
      - name: Check generated build.gradle has no empty values
        run: |
          if grep -nE ":\s*,\s*$|\bundefined\b" app/build.gradle; then
            echo "::error::app/build.gradle has an empty or undefined value (lines above)."
            echo "A field is missing from twa-manifest.json — add it and re-run."
            exit 1
          fi
          echo "build.gradle looks complete."

      - name: Build signed app bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Report upload-key fingerprint
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS }}
        run: |
          fp=$(keytool -list -v -keystore android.keystore -alias "$KEY_ALIAS" \
                 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
               | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          {
            echo "### Upload key SHA-256"
            echo '```'
            echo "$fp"
            echo '```'
            echo "This is the **upload key**. The fingerprint that must go into"
            echo "\`public/.well-known/assetlinks.json\` is Play's **app signing key**,"
            echo "found in Play Console → Release → Setup → App integrity."
            echo "See PLAY_STORE.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: qbli-${{ inputs.versionName }}-${{ inputs.versionCode }}-aab
          path: app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30
