name: Export Signing Keystore (backup)

# Hands you back a copy of the EXISTING signing key so you can store it safely.
#
# This is NOT "Generate Signing Keystore". That workflow creates a NEW key —
# running it now would produce a different key than the one already in the
# secrets, and any app published with the old one could never be updated.
# This workflow only ever reads what is already there.
#
# Use it when the original keystore artifact has expired and GitHub Secrets has
# become your only copy. Secrets are write-only: you cannot read them back out
# of the UI, so without this there is no way to extract the key by hand.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "export" to confirm'
        required: true
        default: ''

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "export" ]; then
            echo '::error::Type "export" in the confirm field to run this workflow.'
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Export and verify keystore
        id: export
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_$name is not set — nothing to export."
              exit 1
            fi
          done

          mkdir -p out
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > out/android.keystore
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > out/keystore.b64

          SIZE=$(stat -c%s out/android.keystore)
          echo "Keystore decoded: $SIZE bytes"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::Decoded keystore is only $SIZE bytes — the stored secret looks corrupt."
            exit 1
          fi

          # Prove the stored password actually opens it. Better to learn that now
          # than when a release upload depends on it.
          if ! keytool -list -keystore out/android.keystore \
                 -storepass "$KEYSTORE_PASSWORD" > /tmp/ks.txt 2>/tmp/ks.err; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the stored keystore."
            sed -e 's/^/  /' /tmp/ks.err | head -5
            exit 1
          fi

          ALIAS=$(awk -F', ' '/PrivateKeyEntry/ {print $1; exit}' /tmp/ks.txt)
          FINGERPRINT=$(keytool -list -v -keystore out/android.keystore \
            -alias "$ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//')

          # Password goes into the artifact only, never the log or the summary.
          cat > out/BACKUP_INFO.txt <<EOF
          Qbli — Android signing key (backup copy)
          Exported: $(date -u '+%Y-%m-%d %H:%M UTC')

          ============================================================
          This is the EXISTING key already used to sign the app.
          It is not a new key. Store it before uploading to Google Play
          — after that first upload it can never be replaced.
          ============================================================

          Key alias:      $ALIAS
          Password:       $KEYSTORE_PASSWORD
                          (same value for keystore and key password)
          Package ID:     com.qbil.app
          SHA-256:        $FINGERPRINT


          WHERE TO PUT THIS

          keystore.b64 is plain text, about 3,500 characters, so any free
          password manager holds it — you do not need paid file storage.

          Bitwarden (free):
            New item -> Secure Note -> name it "Qbli Android signing key"
            Paste: the contents of keystore.b64, this password, the alias
            and the package ID above.

          Then keep a second copy somewhere offline — a USB stick or an
          external drive. Two copies in two places.

          GitHub Secrets is NOT a backup: secrets are write-only and cannot
          be read back out. That is why this workflow exists.

          To turn the text back into a file:
            base64 -d keystore.b64 > android.keystore


          WHEN YOU ARE DONE
          Delete this workflow artifact from the run page, and delete your
          local download.
          EOF

          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: qbli-keystore-backup
          path: out/
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        run: |
          {
            echo "## Signing key exported"
            echo
            echo "Download the **qbli-keystore-backup** artifact from this run and"
            echo "open \`BACKUP_INFO.txt\` — it has the password and where to store it."
            echo
            echo "The artifact expires in **1 day** and contains your private key."
            echo "Save it, then delete the artifact."
            echo
            echo "### Upload key SHA-256"
            echo '```'
            echo "${{ steps.export.outputs.fingerprint }}"
            echo '```'
            echo "This is the upload key. The fingerprint for \`assetlinks.json\` is"
            echo "Play's **app signing key**, which only exists after the first upload."
          } >> "$GITHUB_STEP_SUMMARY"
