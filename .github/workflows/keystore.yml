name: Generate Signing Keystore

# Run this ONCE. It creates the permanent Android signing key for the app and
# hands it back as a downloadable artifact.
#
# The key is generated on GitHub's runner rather than on your machine, so it
# never passes through a chat or an email. The password is written only into the
# artifact — never into the job log, which persists far longer.
#
# Re-running this produces a DIFFERENT key. A new key cannot update an app
# already published under the old one, so only run it again if nothing has been
# published yet.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "generate" to confirm you want to create a NEW signing key'
        required: true
        default: ''
      alias:
        description: 'Key alias (leave as qbli unless you have a reason to change it)'
        required: true
        default: 'qbli'

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "generate" ]; then
            echo '::error::Type "generate" in the confirm field to run this workflow.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Warn if signing secrets already exist
        env:
          EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is already set. If the app is already"
            echo "::warning::published, replacing the key means you can NEVER update that listing."
          fi

      - name: Generate keystore
        id: gen
        env:
          KEY_ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail

          # Hex avoids any shell/base64 quoting surprises downstream.
          PASSWORD="$(openssl rand -hex 24)"
          # Belt and braces: if it ever did reach the log, mask it.
          echo "::add-mask::$PASSWORD"

          mkdir -p out

          keytool -genkeypair -v \
            -keystore out/android.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Qbli, OU=Qbli, O=Qbli, L=Tel Aviv, C=IL" \
            > /dev/null 2>&1

          base64 -w0 out/android.keystore > out/keystore.b64

          FINGERPRINT="$(keytool -list -v \
            -keystore out/android.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$PASSWORD" 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//')"

          PACKAGE_ID="$(node -p "require('./twa-manifest.json').packageId")"

          # The password goes ONLY into the artifact.
          cat > out/KEYSTORE_INFO.txt <<EOF
          Qbli — Android signing key
          Generated: $(date -u '+%Y-%m-%d %H:%M UTC')

          ============================================================
          STORE THIS SOMEWHERE SAFE BEFORE DOING ANYTHING ELSE.
          If this key is lost, you can never update the app on Google
          Play again. Google cannot recover it.
          ============================================================

          Key alias:      $KEY_ALIAS
          Password:       $PASSWORD
                          (same value for both keystore and key password)
          Package ID:     $PACKAGE_ID
          SHA-256:        $FINGERPRINT


          STEP 1 — Add these four repository secrets
          Settings -> Secrets and variables -> Actions -> New repository secret

            ANDROID_KEYSTORE_BASE64     paste the entire contents of keystore.b64
            ANDROID_KEYSTORE_PASSWORD   $PASSWORD
            ANDROID_KEY_PASSWORD        $PASSWORD
            ANDROID_KEY_ALIAS           $KEY_ALIAS

          STEP 2 — Save a permanent copy
          Put android.keystore (the file) AND this password into a password
          manager that supports file attachments — 1Password, or Bitwarden
          Premium. Bitwarden's free tier cannot store files.
          Keep a second copy offline (encrypted USB stick).

          GitHub Secrets is NOT a backup: secrets are write-only and cannot be
          read back out.

          STEP 3 — Clean up
          Delete this workflow artifact from the run page, and delete your
          local download once the above is done.

          STEP 4 — Build
          Actions -> Build Android App Bundle -> Run workflow


          NOTE ON THE FINGERPRINT ABOVE
          That SHA-256 belongs to this UPLOAD key. The fingerprint that goes
          into public/.well-known/assetlinks.json is Play's APP SIGNING key,
          which only exists after the first upload:
          Play Console -> Release -> Setup -> App integrity
          See PLAY_STORE.md step 6.
          EOF

          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbli-signing-keystore
          path: out/
          if-no-files-found: error
          # Short window on purpose: download it, store it, and it disappears.
          retention-days: 1

      - name: Summary
        run: |
          {
            echo "## Signing keystore created"
            echo
            echo "Download the **qbli-signing-keystore** artifact from this run,"
            echo "then open \`KEYSTORE_INFO.txt\` — it has the password and the exact"
            echo "four secrets to add."
            echo
            echo "The artifact expires in **1 day** and contains your private key."
            echo "Save it to a password manager, then delete the artifact."
            echo
            echo "### Upload key SHA-256"
            echo '```'
            echo "${{ steps.gen.outputs.fingerprint }}"
            echo '```'
            echo "Not the fingerprint for assetlinks.json — that one comes from"
            echo "Play Console after your first upload. See PLAY_STORE.md step 6."
          } >> "$GITHUB_STEP_SUMMARY"
