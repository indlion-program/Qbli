name = "qbli-email-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[vars]
APP_URL = "https://REPLACE_WITH_YOUR_APP_DOMAIN"
RESEND_FROM_EMAIL = "Qbli <receipts@REPLACE_WITH_YOUR_DOMAIN>"

# Secrets — set via: wrangler secret put <NAME>
# RESEND_API_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PRICE_ID
